<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="830" viewBox="0 0 1180 830" role="img" aria-label="vdot语义、实现与验证关系">
<rect width="100%" height="100%" fill="#f5f7fa"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="40" y="52" font-size="28" font-weight="700" fill="#173047">vdot语义、实现与验证关系</text>
<text x="40" y="88" font-size="17" fill="#526375">各层检查对象不同；测试通过范围以用例、配置及运行身份为准。</text>
<rect x="40" y="120" width="1100" height="145" rx="10" fill="white" stroke="#c7d3df"/>
